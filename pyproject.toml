[project]
name = "whisper-tool"
version = "0.1.0"
description = "Local audio transcription CLI using faster-whisper or MLX Whisper"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
mlx = [
    "mlx==0.32.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "mlx-whisper==0.4.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
constraint-dependencies = [
    "filelock>=4.2.1",
    "setuptools>=84.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
transcribe = "whisper_tool.cli:main"
